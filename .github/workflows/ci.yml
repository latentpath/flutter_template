name: Flutter CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Generate and check translations
        run: |
          bash tool/generate_localizations.sh
          python3 tool/check_translations.py
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Analyze
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Ensure lockfile stayed unchanged
        run: git diff --exit-code -- pubspec.lock
