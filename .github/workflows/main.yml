name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - run: java -version
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc

      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: git diff --exit-code -- pubspec.lock
      - run: flutter gen-l10n
      - run: python3 tool/check_translations.py
      - run: python3 -m unittest discover -s tool/tests
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

  ios:
    name: iOS Simulator
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - run: xcodebuild -version
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: python3 tool/check_translations.py
      - name: Build iOS Simulator
        id: ios_build
        run: |
          set -o pipefail
          flutter build ios --simulator --no-codesign 2>&1 | tee ios-build.log

      - name: Upload iOS build log
        if: failure() && steps.ios_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios-build.log
          if-no-files-found: ignore
          retention-days: 7
